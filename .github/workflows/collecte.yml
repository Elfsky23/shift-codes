name: Collecte des codes SHiFT

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python collect_codes.py --out shiftcodes.json
      - name: Enregistrer la nouvelle liste
        run: |
          git config user.name "shift-collecteur"
          git config user.email "shift-collecteur@users.noreply.github.com"
          git add shiftcodes.json
          git diff --cached --quiet || git commit -m "Codes SHiFT mis à jour"
          git push
